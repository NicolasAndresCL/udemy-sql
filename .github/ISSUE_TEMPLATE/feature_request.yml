name: Propuesta de mejora
description: Sugerir un cambio en la configuración, el CI o la documentación
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Qué se vuelve difícil o frágil hoy sin este cambio.
    validations:
      required: true

  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
    validations:
      required: true

  - type: checkboxes
    id: datos
    attributes:
      label: Impacto sobre los datos
      options:
        - label: El cambio NO obliga a recrear el volumen `mysql_data`
        - label: Si obliga, la propuesta explica cómo respaldar antes
