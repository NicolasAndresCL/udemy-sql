name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo este job puede crear la release
    steps:
      - uses: actions/checkout@v7

      # Proyecto sin archivo de lenguaje: la versión vive en el README
      # (badge, tabla y pie).
      - name: El tag coincide con la versión del proyecto
        env:
          VERSION_FILE: README.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qF "| **Versión** | $v |" "$VERSION_FILE" \
            || { echo "::error::$VERSION_FILE no declara la versión $v"; exit 1; }

      - name: Notas desde la sección del CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md sin sección [$v]"; exit 1; }

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086  # flags vacío debe desaparecer
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notas.md $flags
